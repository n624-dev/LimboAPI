name: Java CI with Gradle

on:
  push:
    branches: [master, mc-26.3]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Set up JDK
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Cache generated data
        uses: actions/cache@v5.0.4
        with:
          path: |
            plugin/build/minecraft/
            plugin/build/generated/minecraft/mapping/
          key: minecraft-${{ runner.os }}-${{ hashFiles('gradle.properties', 'plugin/build.gradle', 'buildSrc/src/**') }}
      - name: Test generator process handling
        run: ./gradlew -p buildSrc --no-daemon -Dorg.gradle.jvmargs=-Xmx512m test
      - name: Build and check LimboAPI
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx4g build
      - name: Upload JARs
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LimboAPI-26.3-${{ github.sha }}
          path: '*/build/libs/*.jar'
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: reports-${{ github.sha }}
          path: |
            */build/reports/
            buildSrc/build/reports/
          if-no-files-found: ignore
